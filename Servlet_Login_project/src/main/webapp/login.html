<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Customer Login</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6c63ff, #f3f4f6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .login-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            padding: 25px 35px;
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #6c63ff;
            font-size: 24px;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            text-align: left;
        }
        input[type="text"], input[type="password"] {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #6c63ff;
        }
        input[type="submit"], button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"] {
            background-color: #6c63ff;
            margin-bottom: 10px;
        }
        input[type="submit"]:hover {
            background-color: #5248d4;
        }
        button {
            background-color: #28a745;
        }
        button:hover {
            background-color: #218838;
        }
        .register-link {
            margin-top: 20px;
            font-size: 14px;
            color: #6c63ff;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Customer Login</h2>
        <form action="customer" method="post">
            <label for="cuname">Username:</label>
            <input type="text" id="cuname" name="cuname" required>
            
            <label for="cpass">Password:</label>
            <input type="password" id="cpass" name="cpass" required>
            
            <input type="submit" value="Login">
            <button type="button" onclick="location.href='register.html'">New Customer</button>
        </form>
        
    </div>
</body>
</html>
