<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Login</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .login-container {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 20px;
        width: 350px;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }
    form {
        display: flex;
        flex-direction: column;
    }
    input[type="text"] {
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    input[type="submit"], button {
        padding: 10px;
        border: none;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
    }
    input[type="submit"] {
        background-color: #007bff;
        margin-bottom: 10px;
    }
    button {
        background-color: #28a745;
    }
    button:hover, input[type="submit"]:hover {
        opacity: 0.9;
    }
    .form-footer {
        text-align: center;
        margin-top: 10px;
    }
</style>
</head>
<body>
<div class="login-container">
    <h2>Customer Login</h2>
    <form action="customer" method="post">
        <label for="cuname">Username:</label>
        <input type="text" id="cuname" name="cuname" required>
        
        <label for="cpass">Password:</label>
        <input type="text" id="cpass" name="cpass" required>
        
        <input type="submit" value="Login">
        <button type="button" onclick="location.href='register.html'">New Customer</button>
    </form>
   
</div>
</body>
</html>
