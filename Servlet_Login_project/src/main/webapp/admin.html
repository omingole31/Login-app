<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      width: 350px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    input[type="text"],
    input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
    }

    input[type="submit"] {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    input[type="submit"]:hover {
      background-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    .register {
      margin-top: 20px;
    }

    .register a {
      color: #ffffff;
      text-decoration: underline;
    }

    .register a:hover {
      color: #aadfff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Login</h1>
    <form action="admin" method="post">
      <input type="text" name="adname" placeholder="Enter your name" required><br>
      <input type="password" name="adpass" placeholder="Enter your password" required><br>
      <input type="submit" value="Login">
    </form>
    <div class="register">
      <h3>Don't have an account? <a href="adminRegister.html">Register here</a></h3>
    </div>
  </div>
</body>
</html>
