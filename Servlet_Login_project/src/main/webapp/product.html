<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-wrapper {
      width: 350px;
      padding: 25px 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    }

    .form-wrapper h2 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: #007bff;
      outline: none;
    }

    .form-actions {
      text-align: center;
    }

    .form-actions input[type="submit"] {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-actions input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <h2>Add Product</h2>
    <form action="product" method="post">
      <div class="form-group">
        <label for="pcode">Product Code</label>
        <input type="text" id="pcode" name="pcode" required>
      </div>

      <div class="form-group">
        <label for="pname">Product Name</label>
        <input type="text" id="pname" name="pname" required>
      </div>

      <div class="form-group">
        <label for="pprice">Product Price</label>
        <input type="number" id="pprice" name="pprice" required min="0" step="0.01">
      </div>

      <div class="form-group">
        <label for="pstock">Product Stock</label>
        <input type="number" id="pstock" name="pstock" required min="0">
      </div>

      <div class="form-actions">
        <input type="submit" value="Add Product">
      </div>
    </form>
  </div>
</body>
</html>
